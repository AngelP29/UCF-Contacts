<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCF Contacts - Sign Up</title>
    <link rel="stylesheet" type="text/css" href="css/signup.css"> <!-- related CSS file -->
</head>
<body>
    <div class="wrapper">

        <main>
            <div class="background">
                <div class="slash"></div>
            </div>

            <section id="signup-page">

                <div class="header">

                    <div class="logoContainer">
                        <span>UCF Contacts</span>
                    
                        <img src = "contactLogo.png" alt="UCF Contacts Logo">
                      
                        <div class="loginText">
                            <a href="http://cop4331smallproject.com/">
                                 <span>Registered already? Log in.</span>
                            </a>                        
                        </div>
                
                    </div>

                </div>

                <div class="container">
                    <div class="sign-up">
                        <form id="inputs">
                            <h3>Sign Up!</h3>
                            
                            <div class="input-container">
                                <div class="input-container">First Name:</div>
                                
                                <input type="text" id="first-name" placeholder="John"> 

                                <span id="firstname-icon"></span>
                            </div>

                            
                            <div class="input-container">
                                <div class="input-container">Last Name:</div>
            
                                <input type="text" id="last-name" placeholder="Doe">
                            
                                <span id="lastname-icon"></span>
                            </div>

                         
                            <div class="input-container">
                                <div class="input-container">Username:</div>
                                
                                <input type="text" id="username" placeholder="Username">
                            
                                <span id="username-icon"></span>
                            </div>

                            
                            <div class="input-container">
                                <div class="input-container">Password:</div>
                                
                                <input type="password" id="password" placeholder="Password">
                
                                <span id="req-password" class="passwordMatch" style="display: none ;"> 
                                     Password must be a minimum of 8 characters and contain a capital letter, lowercase letter, and number.
                                </span>
                                
                                <span id="password-icon"></span>
                            </div>

                             
                            <div class="input-container">
                                <div class="input-container">Confirm Password:</div>
                                
                                <input type="password" id="password-confirmation" placeholder="Password">

                                <span id="match-password" class="passwordMatch" style="display: none ;"> 
                                     Password fields do not match!
                                </span>
                                
                                <span id="password-confirmation-icon"></span>
                            </div>

                            <div class="submitBtn">
                                <button type="submit" class="btn">Sign Up</button>
                                <p id="error-message" style="color: red;"></p>
                            </div>
                            
                        </form>
                        
                    </div>
                </div>

            </section>
        </main>

        <script src="js/signup.js"></script> <!-- related JS file -->

    </div>
</body>
</html>
